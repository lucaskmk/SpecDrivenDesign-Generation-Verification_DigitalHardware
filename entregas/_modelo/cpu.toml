# =====================================================================
# Manifesto da CPU — copie esta pasta, troque o TODO e rode:
#
#     python -m rvverify entregas/seu_nome
#
# Contrato atual (specs/cpu.md): a CPU é a entidade `cpu` em src/cpu.vhd,
# com as 9 portas do barramento virtual e SEM memória dentro dela. O
# validador fornece a ROM e a RAM pelas portas. Exemplo completo e
# aprovado: cpus/rv32i_gabarito.
# =====================================================================

[design]
name = "TODO_seu_nome"            # identificador curto, aparece no relatório
top  = "cpu"                      # fixo: a entidade de specs/cpu.md
std  = "08"                       # --std= do GHDL

# ORDEM DE ANÁLISE, não alfabética: em VHDL um pacote precisa ser analisado
# antes de quem o usa. O top-level `cpu` vem por último.
sources = [
  # "src/alu.vhd",
  # "src/register_file.vhd",
  "src/cpu.vhd",
]

[clock]
signal    = "clk"
period_ns = 10

[reset]
signal = "rst"
active = "high"        # rst assíncrono, ativo em alto (specs/cpu.md)
cycles = 3

# O programa entra pela porta instr_data: o validador lê instr_addr e
# responde com a instrução. Não há generic de ROM.
[program]
mode       = "virtual"
size_words = 1024

# Mapa da RAM virtual (rvverify/memmap.py). Stores fora dela são ignorados.
[memory]
ram_base  = 0x00FC8100
ram_bytes = 512

# No modo virtual o validador confere a RAM que ele mesmo guarda; nada
# dentro da CPU é observado.
[observe]
ram = "virtual"

# Todo programa de teste termina em `halt: j halt`; o PC fica parado ali.
[halt]
mode       = "fetch_pc"
pc         = "instr_addr"
stationary = 2
drain      = 2

[metrics]
