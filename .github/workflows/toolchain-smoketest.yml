name: Toolchain smoke test (GHDL + cocotb)

on:
  workflow_dispatch: {}
  push:
    paths:
      - .github/workflows/toolchain-smoketest.yml
      - legado/toolchain_smoketest/src/**
      - legado/toolchain_smoketest/test/**

jobs:
  cocotb:
    name: Run demux smoke test
    runs-on: ubuntu-latest
    container:
      image: rafaelcorsi/pl-descomp-cocotb:latest
      options: -v ${{ github.workspace }}:/var/www
    steps:
    - name: Check out the repo
      uses: actions/checkout@v3

    - name: Run test
      run: make -C /var/www/legado/toolchain_smoketest/test/
