# Manifesto gerado por rvgen: deterministico, a partir do contrato
# fixo em rvgen/contrato.py. Nao foi escrito pelo modelo de
# linguagem; so as fontes em src/ foram.

[design]
name = "luna6_prof_3"
top  = "cpu"
std  = "08"
sources = [
    "src/immediate_generator.vhd",
    "src/register_file.vhd",
    "src/alu.vhd",
    "src/decoder.vhd",
    "src/cpu.vhd",
]

[clock]
signal    = "clk"
period_ns = 10

[reset]
signal = "rst"
active = "high"
cycles = 3

[program]
mode         = "virtual"
size_words   = 1024

[memory]
ram_base  = 0x00fc8100
ram_bytes = 512

[observe]
ram       = "virtual"

[halt]
mode = "fetch_pc"
pc = "instr_addr"
stationary = 2
drain = 2

[metrics]
